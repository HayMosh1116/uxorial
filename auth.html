<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXORAL | Account Login & Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      max-width: 460px;
      margin: 60px auto;
      padding: 40px;
      background: var(--card-bg, #121212);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 25px;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      color: #888;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      border-bottom: 2px solid transparent;
    }
    .auth-tab.active {
      color: #fff;
      border-bottom: 2px solid #fff;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-field { margin-bottom: 18px; }
    .auth-field label { display: block; font-size: 13px; margin-bottom: 6px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .auth-field input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      border: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-msg { padding: 12px; border-radius: 4px; font-size: 14px; margin-bottom: 16px; display: none; }
    .auth-msg.error { display: block; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .auth-msg.success { display: block; background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none;">LUXORAL</a></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="account.html">My Orders</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <a href="cart.html" class="cart-nav"><i class='bx bx-shopping-bag'></i><span id="cartBadge">0</span></a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div id="authAlert" class="auth-msg"></div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" required placeholder="name@example.com">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" id="signupName" required placeholder="Ibrahim Doe">
      </div>
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="signupEmail" required placeholder="name@example.com">
      </div>
      <div class="auth-field">
        <label>Phone Number</label>
        <input type="tel" id="signupPhone" required placeholder="+234 815 812 1554">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>
  </div>

  <script>
    function switchTab(mode) {
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
      document.getElementById('loginForm').classList.toggle('active', mode === 'login');
      document.getElementById('signupForm').classList.toggle('active', mode === 'signup');
      document.getElementById('authAlert').style.display = 'none';
    }

    function showAlert(msg, isError = true) {
      const el = document.getElementById('authAlert');
      el.className = 'auth-msg ' + (isError ? 'error' : 'success');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('luxoral_token', data.token);
        localStorage.setItem('luxoral_user', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'account.html';
        }
      } catch (err) {
        showAlert(err.message, true);
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const fullName = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const phone = document.getElementById('signupPhone').value;
      const password = document.getElementById('signupPassword').value;
      try {
        const res = await fetch('/api/auth?action=signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ fullName, email, phone, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');

        localStorage.setItem('luxoral_token', data.token);
        localStorage.setItem('luxoral_user', JSON.stringify(data.user));
        window.location.href = 'account.html';
      } catch (err) {
        showAlert(err.message, true);
      }
    }
  </script>
</body>
</html>
